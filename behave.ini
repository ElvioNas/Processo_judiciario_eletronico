# behave.ini - Configuração do Behave

[behave]
# Diretório onde estão os features
paths = features

# Diretório de step definitions
# paths = features/steps

# Formato de saída padrão: plain, pretty, json, html
format = pretty

# Cores na saída
color = true

# Idioma padrão (português)
lang = pt

# Modo seco (dry run) - apenas valida syntax
# dry_run = false

# Modo de falha rápida (para na primeira falha)
# stop = true

# Modo de debug
# debug = true

# Arquivo de log
# logging_level = DEBUG
# logging_format = %(levelname)s:%(name)s:%(message)s
# logging_file = behave.log

# Ignorar dados sensíveis em relatórios
# stdout_capture = false
# stderr_capture = false

# Tags para executar
# tags = @smoke,@critical

# Padrão de steps
# steps_catalog = false

# Configuração de timeouts (em segundos)
# timeout = 30

# Stdout
stdout_capture = false

# Stderr  
stderr_capture = false

# Log
log_capture = true
